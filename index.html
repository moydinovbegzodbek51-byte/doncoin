<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Don Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f0c06;
    --card: rgba(255, 238, 190, .06);
    --line: rgba(255, 223, 122, .14);
    --gold: #f5b82e;
    --gold2: #ffdf7a;
    --text: #fff6dd;
    --muted: #b8a77a;
    --ok: #4cd964;
    /* joriy skin ranglari (JS o'zgartiradi) */
    --c1: #ffe9a0; --c2: #f5b82e; --c3: #b87a07; --glow: rgba(245,184,46,.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: manipulation; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(600px 400px at 50% 30%, rgba(245,184,46,.12), transparent 70%),
                radial-gradient(500px 300px at 90% 100%, rgba(255,120,40,.08), transparent 70%); }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }

  /* Tepa */
  .top { padding: 12px 16px 4px; text-align: center; position: relative; }
  .who { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 42px; flex-wrap: wrap; }
  .rankchip { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; color: var(--gold2); font-weight: 700; }
  .setbtn { position: absolute; right: 14px; top: 10px; width: 36px; height: 36px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--line); font-size: 18px; line-height: 1; cursor: pointer; color: var(--text); padding: 0; }
  .balance { font-size: 46px; font-weight: 800; color: var(--gold2); line-height: 1.1; margin-top: 6px;
    text-shadow: 0 2px 22px var(--glow); letter-spacing: .5px; }
  .balance small { font-size: 20px; }
  .rate { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .prog { margin: 8px auto 0; max-width: 300px; }
  .prog .bar { height: 6px; }
  .prog-t { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .page { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 0 16px 14px; }
  .page.active { display: flex; }

  /* Tanga */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 250px; perspective: 700px; }
  .coin { width: 230px; height: 230px; border-radius: 50%; border: 0; cursor: pointer; position: relative;
    background: radial-gradient(circle at 35% 28%, var(--c1), var(--c2) 58%, var(--c3));
    box-shadow: 0 12px 50px var(--glow), inset 0 -12px 26px rgba(0,0,0,.28), inset 0 7px 16px rgba(255,255,255,.4);
    font-size: 100px; line-height: 1; transition: transform .12s ease-out; will-change: transform;
    animation: breathe 3.2s ease-in-out infinite; }
  .coin::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.28); pointer-events: none; }
  .coin.turbo { animation: pulse .35s ease-in-out infinite; box-shadow: 0 0 70px #ff7a1a, inset 0 -12px 26px rgba(0,0,0,.28); }
  @keyframes breathe { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
  .float { position: absolute; font-weight: 800; font-size: 28px; color: var(--gold2); pointer-events: none;
    animation: up .9s ease-out forwards; text-shadow: 0 2px 8px rgba(0,0,0,.6); z-index: 3; }
  @keyframes up { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-120px) scale(1.25); } }

  .row { display: flex; gap: 10px; align-items: center; margin: 4px 0 8px; }
  .turbo-btn { flex: 0 0 auto; background: linear-gradient(135deg, #ff7a1a, #ffb02e); color: #2a1200; border: 0; border-radius: 14px;
    padding: 10px 14px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 16px rgba(255,122,26,.35); }
  .turbo-btn:disabled { background: #3a3018; color: #8b7d55; box-shadow: none; }
  .energy { flex: 1; }
  .bar { height: 14px; background: rgba(255,255,255,.07); border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .15s; }
  .energy-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Umumiy kartalar */
  h2 { margin: 8px 0 12px; font-size: 21px; }
  h3 { margin: 16px 0 8px; font-size: 15px; color: var(--gold2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; backdrop-filter: blur(6px); }
  .card .ico { font-size: 30px; }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-weight: 700; }
  .card .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .btn { background: linear-gradient(135deg, var(--gold2), var(--gold)); color: #2a1d00; border: 0; border-radius: 12px; padding: 10px 14px;
    font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn:disabled { background: #3a3018; color: #8b7d55; }
  .btn.ghost { background: transparent; color: var(--gold2); border: 1px solid var(--gold); }
  .btn.danger { background: transparent; color: #ff8a7a; border: 1px solid #c0493d; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .link { word-break: break-all; font-size: 13px; color: var(--gold2); margin: 8px 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }

  /* Skinlar */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .skin { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 10px; text-align: center; }
  .skin.on { border-color: var(--gold); box-shadow: 0 0 20px rgba(245,184,46,.25); }
  .skin .orb { width: 74px; height: 74px; margin: 0 auto 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px;
    box-shadow: inset 0 -6px 12px rgba(0,0,0,.25), inset 0 4px 8px rgba(255,255,255,.35); }
  .skin .orb.fx { position: relative; overflow: hidden; animation: lava 2.6s ease-in-out infinite; }
  .skin .orb.fx::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 34%; left: -50%; transform: skewX(-20deg);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shine 2.8s ease-in-out infinite; }
  @keyframes lava { 0%,100% { box-shadow: inset 0 -6px 12px rgba(0,0,0,.25), inset 0 4px 8px rgba(255,255,255,.35), 0 0 10px rgba(255,140,40,.45); }
    50% { box-shadow: inset 0 -6px 12px rgba(0,0,0,.25), inset 0 4px 8px rgba(255,255,255,.35), 0 0 26px rgba(255,170,60,.95); } }
  @keyframes shine { 0% { left: -50%; } 55%,100% { left: 130%; } }
  .skin .nm { font-weight: 700; font-size: 14px; }
  .skin .bn { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .skin .btn { width: 100%; padding: 8px 6px; font-size: 13px; }

  .gempill { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; color: #7ff0ff; font-weight: 700; }
  .rar { margin: 16px 2px 8px; font-size: 15px; font-weight: 800; }
  .rar:first-child { margin-top: 4px; }
  .rar.common { color: var(--muted); } .rar.epic { color: #c58cff; } .rar.legend { color: #ffb04a; } .rar.mythic { color: #ff6b6b; } .rar.premium { color: #7ff0ff; }
  .skin.r-epic { border-color: rgba(197,140,255,.45); } .skin.r-legend { border-color: rgba(255,176,74,.5); }
  .skin.r-mythic { border-color: rgba(255,107,107,.55); } .skin.r-premium { border-color: rgba(127,240,255,.6); box-shadow: 0 0 14px rgba(127,240,255,.15); }
  .skin.on { border-color: var(--gold) !important; box-shadow: 0 0 20px rgba(245,184,46,.3); }
  .skin .ab { font-size: 11px; color: #7ff0ff; margin: -4px 2px 8px; line-height: 1.3; }
  .btn.gem { background: linear-gradient(135deg, #b8f8ff, #3fd8e8); color: #032a30; }
  .btn.gem:disabled { background: #1c3a40; color: #5d8a92; }
  .tabs { margin: 0 0 12px; }
  .gembox { color: #7ff0ff; text-align: center; font-size: 17px; }
  .ex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ex-grid .btn { padding: 10px 6px; font-size: 13px; white-space: normal; }
  /* Quti topish */
  .box-info { text-align: center; color: var(--text); opacity: .9; font-size: 14px; min-height: 40px; margin: 2px 0 4px; }
  .box-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 12px; }
  .bx { aspect-ratio: 1; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(145deg, #3a2a0c, #1d1509); font-size: 42px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gold2); cursor: pointer; padding: 0; line-height: 1; }
  .bx:disabled { cursor: default; }
  .bx span { font-size: 36px; line-height: 1; }
  .bx small { font-size: 11px; font-weight: 800; margin-top: 5px; color: #fff6dd; }
  .bx.idle { animation: wob 2.4s ease-in-out infinite; border-color: rgba(245,184,46,.45); }
  .bx.idle:nth-child(2n) { animation-delay: .4s; } .bx.idle:nth-child(3n) { animation-delay: .9s; }
  .bx.open { animation: pop .55s ease-out; }
  .bx.open.t1 { background: linear-gradient(145deg, #4a3510, #2a1d08); border-color: #8a6a2a; }
  .bx.open.t2 { background: linear-gradient(145deg, #5a4210, #33240a); border-color: #ffd84a; box-shadow: 0 0 18px rgba(255,216,74,.5); }
  .bx.open.t3 { background: linear-gradient(145deg, #0e4a58, #2a1a5a); border-color: #7ff0ff; box-shadow: 0 0 30px rgba(127,240,255,.85); }
  .bx.open.miss { opacity: .4; animation: none; box-shadow: none; }
  @keyframes wob { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3.5deg); } 75% { transform: rotate(3.5deg); } }
  @keyframes pop { 0% { transform: scale(.55) rotate(-10deg); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
  #boxBtn { width: 100%; padding: 14px; font-size: 16px; }

  /* Xotira */
  .mem-grid { display: grid; gap: 8px; margin: 8px 0 12px; }
  .mc { aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(145deg, #3a2a0c, #1d1509); color: var(--gold2);
    display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; line-height: 1; }
  .mc.up { background: linear-gradient(145deg, #5a4210, #33240a); border-color: #ffd84a; animation: pop .35s ease-out; }
  .mc.done { background: rgba(63,216,232,.16); border-color: #3fd8e8; opacity: .8; }
  .mc.miss { opacity: .45; }
  .mem-lv { display: flex; gap: 8px; margin: 6px 0 10px; }
  .mem-lv .chip { flex: 1; }
  .mem-hud { text-align: center; font-weight: 700; min-height: 22px; margin: 2px 0 4px; }
  #memBtn, #scrBtn { width: 100%; padding: 14px; font-size: 16px; }

  /* Daraja skinlari */
  .rar.rank { color: #ffd84a; }
  .skin.r-rank { border-color: rgba(255,216,74,.7); box-shadow: 0 0 16px rgba(255,216,74,.18); }
  .skin .rq { font-size: 11px; color: #ffd84a; margin: -4px 2px 8px; line-height: 1.3; }
  .skin.locked .orb { filter: grayscale(1) brightness(.5); animation: none; }
  .sk-img { display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .orb .sk-img { width: 112%; height: 112%; max-width: none; flex: 0 0 auto; }
  .skin .orb.art { overflow: visible; animation: artglow 2.8s ease-in-out infinite; }
  @keyframes artglow { 0%,100% { box-shadow: inset 0 -6px 12px rgba(0,0,0,.25), 0 0 10px var(--gl); } 50% { box-shadow: inset 0 -6px 12px rgba(0,0,0,.25), 0 0 28px var(--gl); } }
  .coin.art { display: flex; align-items: center; justify-content: center; padding: 0; overflow: visible; }
  .coin.art .sk-img { width: 106%; height: 106%; max-width: none; flex: 0 0 auto; animation: skfloat 3.4s ease-in-out infinite; }
  @keyframes skfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .ptc { position: absolute; font-size: 18px; line-height: 1; pointer-events: none; z-index: 6; animation: ptc .7s ease-out forwards; }
  @keyframes ptc { from { transform: translate(0,0) scale(1.1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
  /* VIP zal */
  .sh-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 13px; }
  .sh-row > span { width: 130px; flex: 0 0 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sh-bar { flex: 1; height: 9px; background: #2a2010; border-radius: 6px; overflow: hidden; }
  .sh-bar i { display: block; height: 100%; background: linear-gradient(90deg, #8b5cf6, #d8b4fe); }
  .vip-sh { display: block; }
  .vip-sh .desc { margin-bottom: 6px; }
  .cr-sky { position: relative; height: 250px; border-radius: 20px; overflow: hidden; background: linear-gradient(#0b0a24, #27135a 70%, #4a1f7a); border: 2px solid var(--gold); }
  .cr-rocket { position: absolute; left: 10%; bottom: 6%; font-size: 52px; line-height: 1; }
  .cr-m { position: absolute; top: 16px; width: 100%; text-align: center; font-size: 46px; font-weight: 900; color: #ffe08a; }
  .cr-sky.boom .cr-m { color: #ff6a5a; } .cr-sky.boom .cr-rocket { animation: pop .5s ease-out; }
  .vcv { display: block; width: 100%; border-radius: 18px; border: 2px solid var(--gold); background: #1b1530; touch-action: manipulation; }
  .re-box { height: 260px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 900; text-align: center; padding: 12px;
    user-select: none; background: #3a2a0c; border: 2px solid var(--gold); touch-action: manipulation; }
  .re-box.wait { background: #7a1f1f; } .re-box.go { background: #1f8a3a; }
  .sh-arena { position: relative; height: 320px; border-radius: 20px; overflow: hidden; background: radial-gradient(circle, #2a2150, #120d2a); border: 2px solid var(--gold); touch-action: manipulation; }
  .tg { position: absolute; width: 56px; height: 56px; border-radius: 50%; border: 0; font-size: 34px; background: rgba(255,255,255,.1); padding: 0; animation: pop .25s ease-out; }
  .slot-row { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
  .reel { width: 30%; aspect-ratio: 1; border-radius: 18px; background: linear-gradient(#2a1d08, #3a2a0c); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 56px; }
  #vipBtn { width: 100%; padding: 14px; font-size: 16px; }
  .bs-arena { position: relative; height: 340px; border-radius: 20px; overflow: hidden; background: radial-gradient(circle at 50% 60%, #4a1f5a, #140a24); border: 2px solid var(--gold); touch-action: manipulation; user-select: none; }
  .bs-hp { position: absolute; top: 12px; left: 14px; right: 14px; height: 12px; background: #2a1020; border-radius: 8px; overflow: hidden; border: 1px solid #6a2a40; }
  .bs-hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a5a, #ffb36a); transition: width .08s; }
  .bs-boss { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); font-size: 130px; line-height: 1; background: none; border: 0; padding: 0; cursor: pointer; }
  .bs-boss.hit { animation: bhit .15s ease-out; }
  @keyframes bhit { 0% { transform: translate(-50%, -50%) scale(.88) rotate(-4deg); } 100% { transform: translate(-50%, -50%) scale(1); } }
  .dmg { position: absolute; font-weight: 900; color: #ffd84a; font-size: 22px; pointer-events: none; animation: flo .7s ease-out forwards; text-shadow: 0 1px 4px #000; }
  @keyframes flo { to { transform: translateY(-60px); opacity: 0; } }
  .xz-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 12px; }
  .xz-grid .bx { font-size: 34px; } .xz-grid .bx span { font-size: 28px; } .xz-grid .bx small { font-size: 10px; }
  .vip-h { margin: 14px 0 8px; font-weight: 800; color: var(--gold2); }
  #vipRes { white-space: pre-line; }
  /* Scratch card */
  .scr-wrap { position: relative; width: min(100%, 330px); aspect-ratio: 1; margin: 8px auto 12px; border-radius: 20px; overflow: hidden; border: 2px solid var(--gold); background: #2a1d08; }
  .scr-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .sc { display: flex; align-items: center; justify-content: center; font-size: 44px; border: 1px solid rgba(245,184,46,.22); }
  .sc.win { background: rgba(255,216,74,.24); animation: pop .55s ease-out; }
  #scrCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; transition: opacity .35s; display: none; }

  /* Mini-o'yinlar */
  .back { background: none; border: 0; color: var(--gold2); font-size: 14px; font-weight: 700; padding: 4px 0 8px; cursor: pointer; text-align: left; }
  .wheel-wrap { position: relative; width: 290px; height: 290px; margin: 14px auto 10px; flex: 0 0 auto; }
  .wheel { width: 290px; height: 290px; border-radius: 50%; position: relative; border: 6px solid var(--gold);
    box-shadow: 0 0 40px var(--glow), inset 0 0 24px rgba(0,0,0,.45); transition: transform 4.2s cubic-bezier(.12,.7,.1,1); }
  .wl { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .wl span { position: absolute; left: -36px; top: -122px; width: 72px; text-align: center; font-size: 11px; font-weight: 800; line-height: 1.15; color: #fff6dd; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .wl span i { display: block; font-style: normal; font-size: 20px; margin-bottom: 1px; }
  .hub { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; transform: translate(-50%, -50%); border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 35% 28%, var(--c1), var(--c2) 60%, var(--c3)); box-shadow: 0 2px 12px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 3;
    border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid #fff6dd; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .spin-res { text-align: center; font-size: 20px; font-weight: 800; color: var(--gold2); min-height: 28px; margin: 4px 0; }
  .spin-info { text-align: center; font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  #spinBtn { width: 100%; padding: 14px; font-size: 16px; }

  /* Tanga tutish */
  .catch-hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-weight: 800; color: var(--gold2); margin: 0 2px 8px; font-size: 16px; min-height: 22px; }
  .catch-wrap { position: relative; width: 100%; height: min(50vh, 400px); border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line); background: linear-gradient(#1d1509, #0f0c06); }
  .catch-wrap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .catch-ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 22px; background: rgba(15, 12, 6, .6); }
  .catch-wrap.playing .catch-ov { display: none; }
  .catch-how { color: var(--text); opacity: .85; font-size: 14px; line-height: 1.5; }
  .catch-res { font-size: 22px; font-weight: 800; color: var(--gold2); white-space: pre-line; text-align: center; }
  .catch-hud span:last-child { text-align: right; }
  .catch-hud span:nth-child(2) { font-size: 15px; }
  .catch-stats { font-size: 13px; color: var(--text); opacity: .85; white-space: pre-line; text-align: center; }
  .catch-stats:empty { display: none; }
  .catch-ov.done .catch-how { display: none; }
  .catch-res:empty { display: none; }
  .catch-info { font-size: 13px; color: var(--muted); }
  #catchBtn { width: 100%; max-width: 280px; padding: 14px; font-size: 16px; }

  /* Reyting */
  .me { background: linear-gradient(135deg, rgba(245,184,46,.25), rgba(245,184,46,.06)); border-color: var(--gold); }
  .pos { width: 30px; text-align: center; font-weight: 800; color: var(--gold2); }
  .score { font-weight: 800; color: var(--gold2); white-space: nowrap; }

  .catch-rev { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(15,12,6,.74); z-index: 3; padding: 22px; }
  .catch-rev.show { display: flex; }
  .rev-t { font-size: 24px; font-weight: 800; color: #ff8a7a; }
  .catch-rev .btn { width: 100%; max-width: 280px; padding: 14px; font-size: 16px; }
  .fr-gold { --ring: linear-gradient(135deg,#fff3b0,#e0a41c,#8a5a08); --rg: rgba(245,184,46,.75); }
  .fr-ice { --ring: linear-gradient(135deg,#ffffff,#8fd8f5,#2a7aa0); --rg: rgba(143,216,245,.75); }

    titan: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><radialGradient id="aura" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#ff6a18" stop-opacity=".6"/><stop offset="1" stop-color="#ff3a00" stop-opacity="0"/></radialGradient><linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7f76"/><stop offset=".55" stop-color="#4a423c"/><stop offset="1" stop-color="#1c1815"/></linearGradient><linearGradient id="rock2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a99d92"/><stop offset="1" stop-color="#5a5048"/></linearGradient><linearGradient id="horn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3a322c"/><stop offset="1" stop-color="#9a8c80"/></linearGradient><radialGradient id="eye" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c0"/><stop offset=".4" stop-color="#ffb020"/><stop offset="1" stop-color="#ff4a00"/></radialGradient><filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle cx="200" cy="215" r="195" fill="url(#aura)"/><!-- shoulders --><path d="M30 396 L58 318 L120 292 L160 330 L240 330 L280 292 L342 318 L370 396Z" fill="url(#rock)"/><path d="M58 318 L120 292 L110 336 L74 350Z" fill="url(#rock2)" opacity=".7"/><path d="M342 318 L280 292 L290 336 L326 350Z" fill="url(#rock2)" opacity=".5"/><path d="M92 340 L110 372 M300 338 L286 374 M200 350 L196 392" stroke="#ff7a18" stroke-width="4" fill="none" filter="url(#gl)" stroke-linecap="round"/><!-- horns --><path d="M118 118 Q70 80 78 24 Q118 52 150 92Z" fill="url(#horn)"/><path d="M282 118 Q330 80 322 24 Q282 52 250 92Z" fill="url(#horn)"/><path d="M104 96 Q90 64 90 40" stroke="#fff" stroke-width="3" fill="none" opacity=".2" stroke-linecap="round"/><!-- head --><path d="M112 126 L162 84 L240 86 L290 128 L306 208 L282 290 L222 336 L156 330 L108 282 L94 1     imperator: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><radialGradient id="bg" cx="50%" cy="55%" r="60%"><stop offset="0" stop-color="#3a1a7a" stop-opacity=".9"/><stop offset="1" stop-color="#05030f" stop-opacity="0"/></radialGradient><radialGradient id="orb" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#b79cff"/><stop offset=".45" stop-color="#4a24b8"/><stop offset="1" stop-color="#0c0634"/></radialGradient><radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#ff7ad0" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b8"/><stop offset=".5" stop-color="#f5b82e"/><stop offset="1" stop-color="#a86a05"/></linearGradient><linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ff0ff" stop-opacity=".1"/><stop offset=".5" stop-color="#fff3b8"/><stop offset="1" stop-color="#ff9ad8" stop-opacity=".2"/></linearGradient><filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bl"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="oc"><circle cx="200" cy="248" r="104"/></clipPath></defs><circle cx="200" cy="215" r="195" fill="url(#bg)"/><g fill="#fff"><circle cx="40" cy="60" r="2"/><circle cx="90" cy="30" r="1.5"/><circle cx="340" cy="44" r="2.5"/><circle cx="372" cy="120" r="1.5"/><circle cx="26" cy="176" r="1.8"/><circle cx="372" cy="214" r="2"/><circle cx="60" cy="350" r="2"/><circle cx="330" cy="362" r="1.6"/><circle cx="150" cy="22" r="1.4"/><circle cx="258" cy="26" r="1.8"/><circle cx="20" cy="262" r="1.4"/><circle cx="384" cy="300" r="1.6"/></g><!-- ring back half --><ellipse cx="200" cy="250" rx="176" ry="46" transform="rotate(-14 200 250)" fill="none" stroke="url(#ring)" stroke-width="6"/><!-- orb --><c e cx="200" cy="100" r="11" fill="#b79cff" stroke="#fff" stroke-width="2" filter="url(#gl)"/><circle cx="152" cy="140" r="5" fill="#ff4a6a"/><circle cx="248" cy="140" r="5" fill="#ff4a6a"/><circle cx="200" cy="154" r="6" fill="#7ff0ff"/></svg>`,
  };
  const artUrl = (() => { const c = {}; return id => c[id] || (c[id] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(SKIN_ART[id])); })();
  const skinHtml = k => k.art ? `<img class="sk-img" alt="" draggable="false" src="${artUrl(k.art)}">` : k.ico;

  const UPGRADES = [
    { id: "tap",  ico: "👆", val: l => l + 2,                        base: 100, mul: 1.8 },
    { id: "ener", ico: "🔋", val: l => 500 + (l + 1) * 100,          base: 150, mul: 1.7 },
    { id: "reg",  ico: "⚡", val: l => (1 + (l + 1) * 0.5).toFixed(1), base: 250, mul: 1.9 },
    { id: "mine", ico: "⛏️", val: l => (l + 1) * 100,                base: 300, mul: 1.9 },
  ];

  const skinOf = id => SKINS.find(s => s.id === id) || SKINS[0];
  const ab = () => skinOf(S.skin).ab || {};
  const mg = () => ab().mg || 1;   // mini-o'yin tanga ko'paytirgichi
  const perTap  = () => 1 + S.lv.tap + skinOf(S.skin).bonus;
  const maxEn   = () => 500 + S.lv.ener * 100;
  const regen   = () => (1 + S.lv.reg * 0.5) * (ab().regen || 1);
  const perHour = () => S.lv.mine * 100 + (ab().mine || 0);
  const upCost  = u => Math.floor(u.base * Math.pow(u.mul, S.lv[u.id]));
  const turboOn = () => Date.now() < S.turboUntil;
  const OFFH = [3, 6, 12];   // oflayn daromad limiti (soat)
  const rankIdx = () => { let r = 0; RANKS.forEach((x, i) => { if (S.total >= x.at) r = i; }); return r; };

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1900); }
  function haptic(k) { if (S.vib === false) return; try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || "light"); } catch (e) {} }
  function ask(msg, yes) {
    if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) {
      try { tg.showConfirm(msg, ok => { if (ok) yes(); }); return; } catch (e) {}
    }
    if (window.confirm(msg)) yes();
  }
  const confirmBuy = (msg, yes) => { if (S.confirm === false) yes(); else ask(msg, yes); };
  // Kunlik yig'ilgan tanga ham hisoblanadi (sarflash uni kamaytirmaydi)
  function dayRefresh() { if (S.dayKey !== today()) { S.dayKey = today(); S.dayGain = 0; S.dayClaimed = false; } }
  function addCoins(n) { dayRefresh(); S.coins += n; S.total += n; S.dayGain += n; }

  // Turbo har kuni yangilanadi
  function turboRefresh() { if (S.turboDay !== today()) { S.turboDay = today(); S.turboLeft = Math.max(S.turboLeft, 1); } }
  if (!saved.turboV2) { S.turboV2 = true; S.turboLeft = Math.min(S.turboLeft, 1); }   // bepul turbo faqat kuniga 1 ta
  turboRefresh();

  let CG = null;   // tanga tutish o'yini holati

  // Oflayn daromad (maks. 3 soat)
  (function offline() {
    const sec = Math.min((Date.now() - S.last) / 1000, OFFH[S.offLv || 0] * 3600);
    if (sec > 5) {
      S.energy = Math.min(maxEn(), S.energy + sec * regen());
      const gain = perHour() * sec / 3600;
      if (gain >= 1) { addCoins(gain); setTimeout(() => toast(t("offline", { n: fmt(gain) })), 700); }
    }
    S.last = Date.now();
  })();

  // ---------- Ko'rinish ----------
  function applySkin() {
    const k = skinOf(S.skin), r = document.documentElement.style;
    r.setProperty("--c1", k.c[0]); r.setProperty("--c2", k.c[1]); r.setProperty("--c3", k.c[2]); r.setProperty("--glow", k.glow);
    $("coin").innerHTML = skinHtml(k); $("coin").classList.toggle("art", !!k.art);
  }

  // 💎 mukofotlar: daraja, skinlar
  const RANK_GEMS = [0, 1, 2, 3, 5, 10, 15, 20, 30];
  function checkRewards() {
    const msgs = [], ri = rankIdx();
    while (S.rankPaid < ri) { S.rankPaid++; const n = RANK_GEMS[S.rankPaid] || 0; S.gems += n; msgs.push(t("rw_rank", { name: rankName(S.rankPaid), n })); }
    SKINS.filter(k => k.rar === "rank" && ri >= k.rk && !S.owned.includes(k.id)).forEach(k => { S.owned.push(k.id); msgs.push(t("rw_rkskin", { name: t("skin_" + k.id) })); });
    if (!S.skins10 && S.owned.length >= 10) { S.skins10 = true; S.gems += 5; msgs.push(t("rw_skins")); }
    if (msgs.length) { save(); toast(msgs.join(" • ")); haptic("heavy"); }
  }
  function render() {
    checkRewards();
    $("bal").textContent = fmt(S.coins); $("gem").textContent = fmt(S.gems);
    $("rate").textContent = t("rate", { h: fmt(perHour()), p: perTap() }) + (turboOn() ? " ×5 🚀" : "") + (Date.now() < S.x2Until ? " ×2 🔥" : "");
    $("ebar").style.width = (S.energy / maxEn() * 100) + "%";
    $("etext").textContent = `${Math.floor(S.energy)} / ${maxEn()}`;
    const ri = rankIdx(), cur = RANKS[ri], next = RANKS[ri + 1];
    $("rankchip").textContent = `${cur.ico} ${rankName(ri)}`;
    if (next) {
      $("pbar").style.width = Math.min(100, (S.total - cur.at) / (next.at - cur.at) * 100) + "%";
      $("ptext").textContent = t("next_rank", { ico: next.ico, name: rankName(ri + 1), n: fmt(next.at - S.total) });
    } else { $("pbar").style.width = "100%"; $("ptext").textContent = t("max_rank"); }
    // Turbo tugmasi
    const tb = $("turboBtn");
    if (turboOn()) { tb.disabled = true; tb.textContent = `🔥 ${Math.ceil((S.turboUntil - Date.now()) / 1000)}s`; $("coin").classList.add("turbo"); }
    else { tb.disabled = S.turboLeft <= 0; tb.textContent = `🚀 Turbo ${S.turboLeft}`; $("coin").classList.remove("turbo"); }
  }

  function renderUpgrades() {
    const box = $("upgrades"); box.innerHTML = "";
    UPGRADES.forEach(u => {
      const c = upCost(u), l = S.lv[u.id];
      const d = document.createElement("div"); d.className = "card";
      const nm = t("up_" + u.id), desc = t("up_" + u.id + "_d", { n: u.val(l) });
      d.innerHTML = `<div class="ico">${u.ico}</div>
        <div class="info"><div class="name">${nm} <span class="muted">• ${t("u_lvl", { n: l })}</span></div>
        <div class="desc">${t("u_next", { d: desc })}</div></div>
        <button class="btn" ${S.coins < c ? "disabled" : ""}>${fmt(c)} 🪙</button>`;
      d.querySelector("button").onclick = () => {
        if (S.coins < c) return;
        S.coins -= c; S.lv[u.id]++; haptic("medium"); save(); render(); renderUpgrades();
        toast(`${nm}: ${t("u_lvl", { n: S.lv[u.id] })}`);
      };
      box.appendChild(d);
    });
  }

  const RAR = ["common", "epic", "legend", "mythic", "premium", "rank"];
  function renderSkins() {
    const box = $("skins"); box.innerHTML = "";
    RAR.forEach(r => {
      const list = SKINS.filter(k => k.rar === r && (!k.hide || S.owned.includes(k.id)));
      if (!list.length) return;
      const h = document.createElement("div"); h.className = "rar " + r; h.textContent = t("rar_" + r); box.appendChild(h);

  function catchUpdate(g, dt, el) {

      ctx.font = "800 15px sans-serif"; ctx.textAlign = "left";
      const tw = ctx.measureText(txt).width + 24;
      ctx.fillStyle = "rgba(0,0,0,.45)"; rr(ctx, 10, 10, tw, 30, 15); ctx.fill();
      ctx.fillStyle = mult >= 4 ? "#ffb04a" : "#ffdf7a"; ctx.fillText(txt, 22, 26);
      const prog = mult >= 5 ? 1 : (g.combo % 5) / 5;
      ctx.fillStyle = "rgba(255,255,255,.15)"; rr(ctx, 10, 44, tw, 5, 2.5); ctx.fill();
      if (prog > 0) { ctx.fillStyle = "#ffb02e"; rr(ctx, 10, 44, Math.max(5, tw * prog), 5, 2.5); ctx.fill(); }
    }
    let sx = w - 12; ctx.textAlign = "right"; ctx.font = "800 14px sans-serif";
    if (g.magnet > 0) { ctx.fillStyle = PU_COL.magnet; ctx.fillText("🧲 " + Math.ceil(g.magnet) + "s", sx, 26); sx -= 62; }
    if (g.shield) { ctx.fillStyle = PU_COL.shield; ctx.fillText("🛡️", sx, 26); }
    ctx.textAlign = "center";
    if (g.banner) {
      const k = g.banner.life / g.banner.max, s = 0.8 + 0.4 * Math.min(1, (1 - k) * 6);
      ctx.globalAlpha = k < 0.3 ? k / 0.3 : 1; ctx.font = `900 ${Math.round(32 * s)}px sans-serif`;
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.strokeText(g.banner.txt, w / 2, h * 0.3); ctx.fillStyle = g.banner.col; ctx.fillText(g.banner.txt, w / 2, h * 0.3);
      ctx.globalAlpha = 1;
    }
    if (g.state === "count") {
      const f = g.cd - Math.floor(g.cd), n = Math.ceil(g.cd);
      ctx.globalAlpha = 0.3 + 0.7 * f; ctx.font = `900 ${Math.round(96 * (0.7 + 0.3 * f))}px sans-serif`;
      ctx.lineWidth = 8; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(String(n), w / 2, h * 0.4); ctx.fillStyle = "#ffdf7a"; ctx.fillText(String(n), w / 2, h * 0.4);
      ctx.globalAlpha = 1;
    } else if (g.goT > 0) {
      const k = Math.min(1, g.goT / 0.7); ctx.globalAlpha = k; ctx.font = `900 ${Math.round(56 + (1 - k) * 22)}px sans-serif`;
      ctx.lineWidth = 7; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(t("c_go"), w / 2, h * 0.4); ctx.fillStyle = "#8cff7a"; ctx.fillText(t("c_go"), w / 2, h * 0.4);
      ctx.globalAlpha = 1;
    }
    if (g.flash > 0) { ctx.fillStyle = `rgba(255,50,40,${g.flash * 0.55})`; ctx.fillRect(0, 0, w, h); }
  }

  function startCatch() {
    if (CG || catchLeft() <= 0) return;
    S.catchLeft--; save();
    const cv = $("catchCv"), w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const now = performance.now();
    const stars = Array.from({ length: 28 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: 0.6 + Math.random() * 1.4, ph: Math.random() * 6.28, v: 6 + Math.random() * 14 }));
    CG = { w, h, ctx, x: w / 2, px: w / 2, vx: 0, ico: skinOf(S.skin).ico, stars,
      items: [], parts: [], pops: [], queue: [],
      score: 0, combo: 0, best: 0, caught: 0, hearts: CATCH_HEARTS, shield: 0, magnet: 0, extra: 0, frenzy: 0,
      state: "count", cd: 3, t0: 0, last: now, spawn: 0.3, wave: 5, shake: 0, flash: 0, squash: 0, dead: -1, goT: 0,
      react: null, banner: null, raf: 0, uiHearts: -1, revived: false, revT: 0, pauseAt: 0 };
    $("catchWrap").classList.add("playing");
    $("catchOv").classList.remove("done");
    $("catchRes").textContent = ""; $("catchStats").textContent = ""; $("catchInfo").textContent = "";
    $("catchScore").textContent = t("c_score", { n: 0 }); $("catchTime").textContent = t("c_time", { n: CATCH_TIME });
    $("catchHearts").textContent = heartsStr(CATCH_HEARTS);
    haptic("medium"); renderCatch();
    CG.raf = requestAnimationFrame(catchFrame);
  }

  function catchFrame(now) {
    const g = CG; if (!g) return;
    const dt = Math.min(0.05, (now - g.last) / 1000); g.last = now;
    if (g.state === "revive") {                       // jon sotib olish taklifi: o'yin to'xtab turadi
      if (!g.pauseAt) g.pauseAt = now;
      g.revT -= dt;
      if (g.revT <= 0) { declineRev(); return; }
      $("revBtn").textContent = t("c_rev", { c: CATCH_REV }) + " • " + Math.ceil(g.revT);
      catchDraw(g, now); g.raf = requestAnimationFrame(catchFrame); return;
    }
    if (g.state === "count") {
      g.cd -= dt;
      if (g.cd <= 0) { g.state = "play"; g.t0 = now; g.goT = 0.7; haptic("medium"); }
    }
    const playing = g.state === "play";
    const el = playing ? (now - g.t0) / 1000 : 0;
    const left = CATCH_TIME + g.extra - el;
    if (playing && left <= 0) { endCatch(); return; }
    catchUpdate(g, dt, el);
    if (g.dead >= 0) { g.dead -= dt; if (g.dead < 0) { endCatch(); return; } }
    catchDraw(g, now);
    $("catchScore").textContent = t("c_score", { n: g.score });
    $("catchTime").textContent = t("c_time", { n: Math.max(0, Math.ceil(playing ? left : CATCH_TIME)) });
    if (g.uiHearts !== g.hearts) { g.uiHearts = g.hearts; $("catchHearts").textContent = heartsStr(g.hearts); }
    g.raf = requestAnimationFrame(catchFrame);
  }

  function endCatch() {
    const g = CG; if (!g) return;
    CG = null; cancelAnimationFrame(g.raf);
    $("catchRev").classList.remove("show");
    $("catchWrap").classList.remove("playing");
    const played = g.state === "play" || g.state === "revive";
    if (!played) S.catchLeft++;                      // boshlanmay chiqib ketsa, urinish qaytariladi
    const reward = played ? Math.round(Math.min(g.score, CATCH_CAP) * catchRate() * mg()) : 0;
    if (reward > 0) addCoins(reward);
    const newBest = played && g.score > (S.catchBest || 0);
    if (newBest) S.catchBest = g.score;
    save(); render(); haptic("heavy");
    $("catchScore").textContent = t("c_score", { n: g.score }); $("catchTime").textContent = "";
    $("catchHearts").textContent = heartsStr(g.hearts);
    if (played) {
      const stars = g.score >= 80 ? "⭐⭐⭐" : g.score >= 40 ? "⭐⭐" : "⭐";
      $("catchRes").textContent = stars + "\n" + t("c_result", { s: g.score, n: fmt(reward) });
      $("catchStats").textContent = t("c_stats", { c: g.best, k: g.caught }) + (newBest ? "\n" + t("c_best") : "");
      $("catchOv").classList.add("done");
      if (reward > 0) toast("🪙 +" + fmt(reward));
    }
    renderCatch();
  }

  const catchCv = $("catchCv");
  function catchMove(e) { if (!CG) return; const r = catchCv.getBoundingClientRect(); CG.x = Math.max(30, Math.min(CG.w - 30, e.clientX - r.left)); }
  catchCv.addEventListener("pointerdown", e => { e.preventDefault(); try { catchCv.setPointerCapture(e.pointerId); } catch (_) {} catchMove(e); });
  catchCv.addEventListener("pointermove", e => { e.preventDefault(); catchMove(e); });
  function acceptRev() {
    const g = CG; if (!g || g.state !== "revive" || S.gems < CATCH_REV) return;
    S.gems -= CATCH_REV; g.revived = true; g.hearts = 1; g.shield = 1; g.dead = -1;
    g.items = g.items.filter(i => i.type !== "bomb");
    const now = performance.now(); g.t0 += now - g.pauseAt; g.last = now; g.state = "play";
    g.react = { e: "😅", life: 1 }; $("catchRev").classList.remove("show"); haptic("heavy"); save(); render();
  }
  function declineRev() {
    const g = CG; if (!g) return;
    $("catchRev").classList.remove("show"); g.state = "play"; g.dead = 0.4;
    g.raf = requestAnimationFrame(catchFrame);
  }
  $("revBtn").onclick = acceptRev; $("revNo").onclick = declineRev;
  $("catchBtn").onclick = () => {
    if (CG) return;
    if (catchLeft() > 0) { startCatch(); return; }
    if (S.gems < CATCH_EXTRA) return;
    confirmBuy(t("cf_try", { c: CATCH_EXTRA }), () => { if (S.gems < CATCH_EXTRA) return; S.gems -= CATCH_EXTRA; S.catchLeft++; save(); render(); startCatch(); });
  };
  $("openCatch").onclick = () => { $("catchOv").classList.remove("done"); $("catchStats").textContent = ""; $("catchHearts").textContent = ""; $("catchRes").textContent = ""; $("catchScore").textContent = ""; $("catchTime").textContent = ""; renderCatch(); $("gamesList").style.display = "none"; $("catchView").style.display = "block"; };
  $("catchBack").onclick = () => { if (CG) endCatch(); $("catchView").style.display = "none"; $("gamesList").style.display = "block"; renderCatch(); };

  // ---------- Do'stlar ----------
  const ref = `https://t.me/${BOT_USERNAME}?start=${uid}`;
  $("refLink").textContent = ref;
  $("shareBtn").onclick = () => {
    const url = "https://t.me/share/url?url=" + encodeURIComponent(ref) + "&text=" + encodeURIComponent(t("share_text"));
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  };
  $("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(ref); toast(t("copied")); } catch (e) { toast(t("copy_fail")); } };

  // ---------- Reyting (Firebase) ----------
  async function pushScore() {
    if (!FIREBASE_URL || uid === "guest") return;
    const total = Math.floor(S.total);
    if (total === S.synced) return;
    try {
      await fetch(`${FIREBASE_URL}/players/${uid}.json`, { method: "PUT",
        body: JSON.stringify({ n: myName.slice(0, 24), c: total, s: S.skin, u: Date.now() }) });
      S.synced = total; save();
    } catch (e) {}
  }
  async function loadBoard() {
    const box = $("board");
    if (!FIREBASE_URL) { box.innerHTML = `<div class="box muted">${t("r_off")}</div>`; return; }
    box.innerHTML = `<div class="muted">${t("r_loading")}</div>`;
    try {
      await pushScore();
      const res = await fetch(`${FIREBASE_URL}/players.json?orderBy=${encodeURIComponent('"c"')}&limitToLast=50`);
      const data = await res.json() || {};
      const arr = Object.entries(data).map(([id, v]) => ({ id, n: v.n || t("player"), c: v.c || 0, s: v.s })).sort((a, b) => b.c - a.c);
      box.innerHTML = "";
      if (!arr.length) { box.innerHTML = `<div class="muted">${t("r_none")}</div>`; return; }
      const medals = ["🥇", "🥈", "🥉"];
      arr.forEach((p, i) => {
        const d = document.createElement("div"); d.className = "card" + (p.id === uid ? " me" : "");
        const pos = document.createElement("div"); pos.className = "pos"; pos.textContent = medals[i] || (i + 1);
        const ico = document.createElement("div"); ico.className = "ico"; ico.textContent = skinOf(p.s).ico;
        const info = document.createElement("div"); info.className = "info";
        const nm = document.createElement("div"); nm.className = "name"; nm.textContent = p.n + (p.id === uid ? " " + t("r_you") : "");
        const rk = document.createElement("div"); rk.className = "desc";
        let ri = 0; RANKS.forEach((x, k) => { if (p.c >= x.at) ri = k; }); rk.textContent = RANKS[ri].ico + " " + rankName(ri);
        info.append(nm, rk);
        const sc = document.createElement("div"); sc.className = "score"; sc.textContent = fmt(p.c) + " 🪙";
        d.append(pos, ico, info, sc); box.appendChild(d);
      });
    } catch (e) { box.innerHTML = `<div class="box muted">${t("r_err")}</div>`; }
  }

  // ---------- Yo'riqnoma ----------
  const TU = [{ ico: "🦆", k: "tu1" }, { ico: "⬆️", k: "tu2" }, { ico: "🎮", k: "tu3" }];
  let tuIdx = 0;
  function renderTut() {
    const s = TU[tuIdx];
    $("tuIco").textContent = s.ico; $("tuTitle").textContent = t(s.k + "_t"); $("tuDesc").textContent = t(s.k + "_d");
    $("tuDots").innerHTML = TU.map((_, i) => `<span class="${i === tuIdx ? "on" : ""}"></span>`).join("");
    const last = tuIdx === TU.length - 1;
    $("tuNext").textContent = last ? t("tu_start") : t("tu_next");
    $("tuSkip").textContent = t("tu_skip"); $("tuSkip").style.visibility = last ? "hidden" : "visible";
  }
  function showTut() { tuIdx = 0; renderTut(); $("tutorial").style.display = "flex"; }
  function closeTut() { $("tutorial").style.display = "none"; S.seen = true; save(); }
  $("tuNext").onclick = () => { if (tuIdx < TU.length - 1) { tuIdx++; renderTut(); } else closeTut(); };
  $("tuSkip").onclick = closeTut;

  // ---------- Til va sozlamalar ----------
  function renderProfile() {
    const k = skinOf(S.skin), ri = rankIdx(), cur = RANKS[ri], next = RANKS[ri + 1];
    const skinTotal = SKINS.filter(x => !x.hide).length, skinHave = S.owned.filter(id => { const x = SKINS.find(y => y.id === id); return x && !x.hide; }).length;
    const days = Math.floor((Date.now() - S.since) / DAY) + 1;
    const pct = next ? Math.min(100, (S.total - cur.at) / (next.at - cur.at) * 100) : 100;
    const stats = [["🪙", fmt(S.total), "pf_total"], ["💎", fmt(S.gems), "pf_gems"], ["👆", fmt(S.taps || 0), "pf_taps"], ["🎨", skinHave + " / " + skinTotal, "pf_skins"],
      ["💪", "+" + perTap(), "pf_tap"], ["⛏️", "+" + fmt(perHour()), "pf_hour"], ["🏆", fmt(S.catchBest || 0), "pf_catch"], ["📅", days, "pf_days"]];
    const nm = String(myName).replace(/[<>&"]/g, "");
    $("profile").innerHTML = `<div class="pf-top"><div class="pf-av ${decorFrame()}"><div class="orb" style="background:radial-gradient(circle at 35% 28%,${k.c[0]},${k.c[1]} 58%,${k.c[2]})">${skinHtml(k)}</div></div>
      <div><div class="pf-name">${nm} ${decorBadge()}</div><div class="pf-id">ID: ${uid}</div><span class="pf-rank">${cur.ico} ${rankName(ri)}</span></div></div>
      <div class="pf-bar"><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="pf-next">${next ? t("next_rank", { ico: next.ico, name: rankName(ri + 1), n: fmt(next.at - S.total) }) : t("max_rank")}</div>
      <div class="pf-grid">${stats.map(x => `<div><b>${x[0]} ${x[1]}</b><span>${t(x[2])}</span></div>`).join("")}</div>`;
  }
  function renderSettings() {
    renderProfile();
    $("confBtn").textContent = S.confirm === false ? t("off") : t("on");
    $("vibBtn").textContent = S.vib === false ? t("off") : t("on");
    document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    render(); renderUpgrades(); renderSkins(); renderDaily(); renderQuest(); renderChan(); renderRef(); renderGames(); renderSettings(); renderTut(); renderShop(); renderBox();
    if (wheelBuilt) buildWheel();
    if ($("p-rank").classList.contains("active")) loadBoard();
    if (!CG) { $("catchRes").textContent = ""; }
    renderUser();
  }
  function setLang(l) { if (!LANGS.includes(l) || l === lang) return; lang = l; S.lang = l; save(); applyLang(); }
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));
  $("confBtn").onclick = () => { S.confirm = S.confirm === false; save(); renderSettings(); };
  $("vibBtn").onclick = () => { S.vib = S.vib === false; save(); renderSettings(); if (S.vib) haptic("medium"); };
  $("tutBtn").onclick = () => showTut();
  $("resetBtn").onclick = () => ask(t("reset_ask"), () => {
    const keep = { lang: S.lang, vib: S.vib, confirm: S.confirm };
    S = JSON.parse(JSON.stringify(def));
    S.last = Date.now(); S.seen = true; S.lang = keep.lang; S.vib = keep.vib; S.confirm = keep.confirm;
    turboRefresh(); save(); forceReset = true; pushState(); applySkin(); applyLang(); go("p-tap"); toast(t("reset_done"));
  });

  // ---------- Navigatsiya ----------
  function go(p) {
    if (CG) endCatch();
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x.dataset.p === p));
    document.querySelectorAll(".page").forEach(x => x.classList.toggle("active", x.id === p));
    if (p === "p-up") { renderUpgrades(); renderShop(); }
    if (p === "p-skin") renderSkins();
    if (p === "p-task") { renderDaily(); renderQuest(); renderRef(); claimRefs(); }
    if (p === "p-rank") loadBoard();
    if (p === "p-games") renderGames();
    if (p === "p-set") renderSettings();
  }
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.p));
  $("setBtn").onclick = () => go("p-set");
  $("setBack").onclick = () => go("p-tap");

  // ---------- Asosiy sikl ----------
  setInterval(() => {
    S.energy = Math.min(maxEn(), S.energy + regen());
    if (perHour()) addCoins(perHour() / 3600);
    S.last = Date.now();
    render(); save();
    if ($("p-up").classList.contains("active")) renderUpgrades();
    if ($("p-skin").classList.contains("active")) renderSkins();
    if ($("p-task").classList.contains("active")) { renderDaily(); renderQuest(); }
    if ($("p-games").classList.contains("active")) renderGames();
  }, 1000);
  setInterval(pushScore, 20000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && CG) endCatch();   // fon rejimida o'yin to'xtaydi
    S.last = Date.now(); save(); if (document.hidden) { pushScore(); pushState(); } else { claimRefs(); claimGems(); }
  });
  window.addEventListener("pagehide", save);

  applySkin(); applyLang(); pushScore();
  if (!S.seen) showTut();
})();
</script>
</body>
</html>
