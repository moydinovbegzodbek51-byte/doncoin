<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Don Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f0c06;
    --card: rgba(255, 238, 190, .06);
    --line: rgba(255, 223, 122, .14);
    --gold: #f5b82e;
    --gold2: #ffdf7a;
    --text: #fff6dd;
    --muted: #b8a77a;
    --ok: #4cd964;
    /* joriy skin ranglari (JS o'zgartiradi) */
    --c1: #ffe9a0; --c2: #f5b82e; --c3: #b87a07; --glow: rgba(245,184,46,.4);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; touch-action: manipulation; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(600px 400px at 50% 30%, rgba(245,184,46,.12), transparent 70%),
                radial-gradient(500px 300px at 90% 100%, rgba(255,120,40,.08), transparent 70%); }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; }

  /* Tepa */
  .top { padding: 12px 16px 4px; text-align: center; position: relative; }
  .who { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 42px; flex-wrap: wrap; }
  .rankchip { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; color: var(--gold2); font-weight: 700; }
  .setbtn { position: absolute; right: 14px; top: 10px; width: 36px; height: 36px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--line); font-size: 18px; line-height: 1; cursor: pointer; color: var(--text); padding: 0; }
  .balance { font-size: 46px; font-weight: 800; color: var(--gold2); line-height: 1.1; margin-top: 6px;
    text-shadow: 0 2px 22px var(--glow); letter-spacing: .5px; }
  .balance small { font-size: 20px; }
  .rate { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .prog { margin: 8px auto 0; max-width: 300px; }
  .prog .bar { height: 6px; }
  .prog-t { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .page { flex: 1; display: none; flex-direction: column; overflow-y: auto; padding: 0 16px 14px; }
  .page.active { display: flex; }

  /* Tanga */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 250px; perspective: 700px; }
  .coin { width: 230px; height: 230px; border-radius: 50%; border: 0; cursor: pointer; position: relative;
    background: radial-gradient(circle at 35% 28%, var(--c1), var(--c2) 58%, var(--c3));
    box-shadow: 0 12px 50px var(--glow), inset 0 -12px 26px rgba(0,0,0,.28), inset 0 7px 16px rgba(255,255,255,.4);
    font-size: 100px; line-height: 1; transition: transform .12s ease-out; will-change: transform;
    animation: breathe 3.2s ease-in-out infinite; }
  .coin::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px dashed rgba(255,255,255,.28); pointer-events: none; }
  .coin.turbo { animation: pulse .35s ease-in-out infinite; box-shadow: 0 0 70px #ff7a1a, inset 0 -12px 26px rgba(0,0,0,.28); }
  @keyframes breathe { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.12); } }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
  .float { position: absolute; font-weight: 800; font-size: 28px; color: var(--gold2); pointer-events: none;
    animation: up .9s ease-out forwards; text-shadow: 0 2px 8px rgba(0,0,0,.6); z-index: 3; }
  @keyframes up { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-120px) scale(1.25); } }

  .row { display: flex; gap: 10px; align-items: center; margin: 4px 0 8px; }
  .turbo-btn { flex: 0 0 auto; background: linear-gradient(135deg, #ff7a1a, #ffb02e); color: #2a1200; border: 0; border-radius: 14px;
    padding: 10px 14px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 16px rgba(255,122,26,.35); }
  .turbo-btn:disabled { background: #3a3018; color: #8b7d55; box-shadow: none; }
  .energy { flex: 1; }
  .bar { height: 14px; background: rgba(255,255,255,.07); border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width .15s; }
  .energy-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* Umumiy kartalar */
  h2 { margin: 8px 0 12px; font-size: 21px; }
  h3 { margin: 16px 0 8px; font-size: 15px; color: var(--gold2); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; backdrop-filter: blur(6px); }
  .card .ico { font-size: 30px; }
  .card .info { flex: 1; min-width: 0; }
  .card .name { font-weight: 700; }
  .card .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .btn { background: linear-gradient(135deg, var(--gold2), var(--gold)); color: #2a1d00; border: 0; border-radius: 12px; padding: 10px 14px;
    font-weight: 800; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .btn:disabled { background: #3a3018; color: #8b7d55; }
  .btn.ghost { background: transparent; color: var(--gold2); border: 1px solid var(--gold); }
  .btn.danger { background: transparent; color: #ff8a7a; border: 1px solid #c0493d; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .link { word-break: break-all; font-size: 13px; color: var(--gold2); margin: 8px 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }

  /* Skinlar */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .skin { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 10px; text-align: center; }
  .skin.on { border-color: var(--gold); box-shadow: 0 0 20px rgba(245,184,46,.25); }
  .skin .orb { width: 74px; height: 74px; margin: 0 auto 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 38px;
    box-shadow: inset 0 -6px 12px rgba(0,0,0,.25), inset 0 4px 8px rgba(255,255,255,.35); }
  .skin .nm { font-weight: 700; font-size: 14px; }
  .skin .bn { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
  .skin .btn { width: 100%; padding: 8px 6px; font-size: 13px; }

  /* Mini-o'yinlar */
  .back { background: none; border: 0; color: var(--gold2); font-size: 14px; font-weight: 700; padding: 4px 0 8px; cursor: pointer; text-align: left; }
  .wheel-wrap { position: relative; width: 290px; height: 290px; margin: 14px auto 10px; flex: 0 0 auto; }
  .wheel { width: 290px; height: 290px; border-radius: 50%; position: relative; border: 6px solid var(--gold);
    box-shadow: 0 0 40px var(--glow), inset 0 0 24px rgba(0,0,0,.45); transition: transform 4.2s cubic-bezier(.12,.7,.1,1); }
  .wl { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .wl span { position: absolute; left: -36px; top: -122px; width: 72px; text-align: center; font-size: 11px; font-weight: 800; line-height: 1.15; color: #fff6dd; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
  .wl span i { display: block; font-style: normal; font-size: 20px; margin-bottom: 1px; }
  .hub { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; transform: translate(-50%, -50%); border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 35% 28%, var(--c1), var(--c2) 60%, var(--c3)); box-shadow: 0 2px 12px rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; z-index: 3;
    border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 28px solid #fff6dd; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  .spin-res { text-align: center; font-size: 20px; font-weight: 800; color: var(--gold2); min-height: 28px; margin: 4px 0; }
  .spin-info { text-align: center; font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  #spinBtn { width: 100%; padding: 14px; font-size: 16px; }

  /* Tanga tutish */
  .catch-hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-weight: 800; color: var(--gold2); margin: 0 2px 8px; font-size: 16px; min-height: 22px; }
  .catch-wrap { position: relative; width: 100%; height: min(50vh, 400px); border-radius: 18px; overflow: hidden;
    border: 1px solid var(--line); background: linear-gradient(#1d1509, #0f0c06); }
  .catch-wrap canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .catch-ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 22px; background: rgba(15, 12, 6, .6); }
  .catch-wrap.playing .catch-ov { display: none; }
  .catch-how { color: var(--text); opacity: .85; font-size: 14px; line-height: 1.5; }
  .catch-res { font-size: 22px; font-weight: 800; color: var(--gold2); white-space: pre-line; text-align: center; }
  .catch-hud span:last-child { text-align: right; }
  .catch-hud span:nth-child(2) { font-size: 15px; }
  .catch-stats { font-size: 13px; color: var(--text); opacity: .85; white-space: pre-line; text-align: center; }
  .catch-stats:empty { display: none; }
  .catch-ov.done .catch-how { display: none; }
  .catch-res:empty { display: none; }
  .catch-info { font-size: 13px; color: var(--muted); }
  #catchBtn { width: 100%; max-width: 280px; padding: 14px; font-size: 16px; }

  /* Reyting */
  .me { background: linear-gradient(135deg, rgba(245,184,46,.25), rgba(245,184,46,.06)); border-color: var(--gold); }
  .pos { width: 30px; text-align: center; font-weight: 800; color: var(--gold2); }
  .score { font-weight: 800; color: var(--gold2); white-space: nowrap; }

  /* Sozlamalar */
  .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chip { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .chip.on { color: #2a1d00; background: linear-gradient(135deg, var(--gold2), var(--gold)); border-color: var(--gold); }

  /* Yo'riqnoma */
  .tut { position: fixed; inset: 0; z-index: 30; background: rgba(8, 6, 2, .94); display: none; align-items: center; justify-content: center; padding: 20px; }
  .tut-card { width: min(100%, 380px); text-align: center; }
  .tut-langs { display: flex; gap: 8px; justify-content: center; margin-bottom: 22px; }
  .tut-ico { font-size: 84px; line-height: 1; margin-bottom: 14px; }
  .tut-card h2 { font-size: 24px; margin: 0 0 10px; color: var(--gold2); }
  .tut-card p { color: var(--text); opacity: .86; font-size: 15px; line-height: 1.55; margin: 0 0 18px; min-height: 96px; }
  .dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .dots span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .dots span.on { background: var(--gold); width: 22px; border-radius: 6px; }
  .tut-card .btn { width: 100%; padding: 14px; font-size: 16px; }

  /* Pastki menyu */
  nav { display: flex; background: rgba(20,15,6,.92); border-top: 1px solid var(--line); }
  nav button { flex: 1; background: none; border: 0; color: var(--muted); padding: 8px 0 10px; font-size: 10px; cursor: pointer; }
  nav button b { display: block; font-size: 20px; margin-bottom: 1px; font-weight: 400; }
  nav button.active { color: var(--gold2); }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
    background: #000d; color: #fff; padding: 10px 16px; border-radius: 12px; opacity: 0; transition: .25s; pointer-events: none; font-size: 14px; z-index: 40; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="who"><span id="user">Don Coin</span><span class="rankchip" id="rankchip"></span></div>
    <button class="setbtn" id="setBtn" aria-label="Settings">⚙️</button>
    <div class="balance"><span id="bal">0</span> <small>🪙</small></div>
    <div class="rate" id="rate"></div>
    <div class="prog">
      <div class="bar"><i id="pbar" style="width:0"></i></div>
      <div class="prog-t" id="ptext"></div>
    </div>
  </div>

  <!-- TAP -->
  <section class="page active" id="p-tap">
    <div class="stage" id="stage">
      <button class="coin" id="coin" aria-label="Tap">🦆</button>
    </div>
    <div class="row">
      <button class="turbo-btn" id="turboBtn">🚀 Turbo</button>
      <div class="energy">
        <div class="bar"><i id="ebar"></i></div>
        <div class="energy-text"><span data-i18n="energy"></span><span id="etext"></span></div>
      </div>
    </div>
  </section>

  <!-- MINI-O'YINLAR -->
  <section class="page" id="p-games">
    <div id="gamesList">
      <h2 data-i18n="g_title"></h2>
      <div class="muted" style="margin-bottom:10px" data-i18n="g_sub"></div>
      <div class="card">
        <div class="ico">🎡</div>
        <div class="info"><div class="name" data-i18n="g_wheel"></div><div class="desc" data-i18n="g_wheel_d"></div></div>
        <button class="btn" id="openWheel" data-i18n="g_play"></button>
      </div>
      <div class="card">
        <div class="ico">🪙</div>
        <div class="info"><div class="name" data-i18n="g_catch"></div><div class="desc" id="catchListDesc"></div></div>
        <button class="btn" id="openCatch" data-i18n="g_play"></button>
      </div>
    </div>

    <div id="wheelView" style="display:none">
      <button class="back" id="wheelBack" data-i18n="back"></button>
      <h2 style="margin-top:0" data-i18n="wheel_title"></h2>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="hub">🦆</div>
      </div>
      <div class="spin-res" id="wheelRes"></div>
      <div class="spin-info" id="spinInfo"></div>
      <button class="btn" id="spinBtn"></button>
      <div class="muted" style="margin-top:12px;text-align:center" data-i18n="wheel_note"></div>
    </div>

    <div id="catchView" style="display:none">
      <button class="back" id="catchBack" data-i18n="back"></button>
      <h2 style="margin-top:0" data-i18n="c_title"></h2>
      <div class="catch-hud"><span id="catchScore"></span><span id="catchHearts"></span><span id="catchTime"></span></div>
      <div class="catch-wrap" id="catchWrap">
        <canvas id="catchCv"></canvas>
        <div class="catch-ov" id="catchOv">
          <div class="catch-res" id="catchRes"></div>
          <div class="catch-stats" id="catchStats"></div>
          <div class="catch-how" data-i18n="c_how"></div>
          <div class="catch-info" id="catchInfo"></div>
          <button class="btn" id="catchBtn"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- REYTING -->
  <section class="page" id="p-rank">
    <h2 data-i18n="r_title"></h2>
    <div id="board"></div>
  </section>

  <!-- SKINLAR -->
  <section class="page" id="p-skin">
    <h2 data-i18n="s_title"></h2>
    <div class="muted" style="margin-bottom:10px" data-i18n="s_sub"></div>
    <div class="grid" id="skins"></div>
  </section>

  <!-- YAXSHILASH -->
  <section class="page" id="p-up">
    <h2 data-i18n="u_title"></h2>
    <div id="upgrades"></div>
  </section>

  <!-- VAZIFALAR + DO'STLAR -->
  <section class="page" id="p-task">
    <h2 data-i18n="tk_title"></h2>
    <div class="card">
      <div class="ico">🎁</div>
      <div class="info"><div class="name" data-i18n="daily"></div><div class="desc" id="dailyDesc"></div></div>
      <button class="btn" id="dailyBtn" data-i18n="daily_get"></button>
    </div>
    <div class="card">
      <div class="ico">📣</div>
      <div class="info"><div class="name" data-i18n="chan"></div><div class="desc" data-i18n="chan_d"></div></div>
      <button class="btn" id="chanBtn"></button>
    </div>
    <div class="card">
      <div class="ico">🪙</div>
      <div class="info">
        <div class="name" data-i18n="quest"></div>
        <div class="desc" id="questDesc"></div>
        <div class="bar" style="height:6px;margin-top:6px"><i id="questBar" style="width:0"></i></div>
      </div>
      <button class="btn" id="questBtn"></button>
    </div>
    <h3 data-i18n="fr_title"></h3>
    <div class="box">
      <div><b data-i18n="fr_h"></b></div>
      <div class="muted" data-i18n="fr_d"></div>
      <div class="link" id="refLink"></div>
      <button class="btn" id="shareBtn" data-i18n="fr_share"></button>
      <button class="btn ghost" id="copyBtn" data-i18n="fr_copy"></button>
    </div>
  </section>

  <!-- SOZLAMALAR -->
  <section class="page" id="p-set">
    <button class="back" id="setBack" data-i18n="back"></button>
    <h2 style="margin-top:0" data-i18n="set_title"></h2>
    <div class="box">
      <div><b data-i18n="set_lang"></b></div>
      <div class="chips">
        <button class="chip" data-lang="uz">O'zbekcha</button>
        <button class="chip" data-lang="ru">Русский</button>
        <button class="chip" data-lang="en">English</button>
      </div>
    </div>
    <div class="card">
      <div class="ico">📳</div>
      <div class="info"><div class="name" data-i18n="set_vib"></div><div class="desc" data-i18n="set_vib_d"></div></div>
      <button class="btn ghost" id="vibBtn"></button>
    </div>
    <div class="card">
      <div class="ico">🧭</div>
      <div class="info"><div class="name" data-i18n="set_tut"></div><div class="desc" data-i18n="set_tut_d"></div></div>
      <button class="btn ghost" id="tutBtn" data-i18n="set_show"></button>
    </div>
    <div class="card">
      <div class="ico">🗑️</div>
      <div class="info"><div class="name" data-i18n="set_reset"></div><div class="desc" data-i18n="set_reset_d"></div></div>
      <button class="btn danger" id="resetBtn" data-i18n="set_reset_btn"></button>
    </div>
    <div class="muted" style="text-align:center;margin-top:6px">Don Coin • v3</div>
  </section>

  <nav>
    <button class="active" data-p="p-tap"><b>🪙</b><span data-i18n="n_tap"></span></button>
    <button data-p="p-games"><b>🎮</b><span data-i18n="n_games"></span></button>
    <button data-p="p-rank"><b>🏆</b><span data-i18n="n_rank"></span></button>
    <button data-p="p-skin"><b>🎨</b><span data-i18n="n_skin"></span></button>
    <button data-p="p-up"><b>⬆️</b><span data-i18n="n_up"></span></button>
    <button data-p="p-task"><b>📋</b><span data-i18n="n_task"></span></button>
  </nav>
</div>

<!-- YO'RIQNOMA -->
<div class="tut" id="tutorial">
  <div class="tut-card">
    <div class="tut-langs">
      <button class="chip" data-lang="uz">UZ</button>
      <button class="chip" data-lang="ru">RU</button>
      <button class="chip" data-lang="en">EN</button>
    </div>
    <div class="tut-ico" id="tuIco"></div>
    <h2 id="tuTitle"></h2>
    <p id="tuDesc"></p>
    <div class="dots" id="tuDots"></div>
    <button class="btn" id="tuNext"></button>
    <button class="back" id="tuSkip" style="margin-top:8px"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ====== SOZLAMALAR ======
  const BOT_USERNAME = "DonCoinTapBot";
  const CHANNEL_URL  = "https://t.me/doncointap";
  // Reyting uchun Firebase Realtime Database manzili (bo'sh qoldirsangiz, reyting o'chiq turadi).
  const FIREBASE_URL = "https://doncoin0-default-rtdb.firebaseio.com";
  // ========================

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#0f0c06"); tg.setBackgroundColor("#0f0c06"); } catch (e) {} }
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const uid = tgUser ? String(tgUser.id) : "guest";
  const $ = id => document.getElementById(id);
  const fmt = n => Math.floor(n).toLocaleString("en-US").replace(/,/g, " ");
  // Mahalliy sana (yarim tunda yangilanadi)
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  function untilMidnight() {
    const n = new Date(), next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1), ms = next - n;
    return { h: Math.floor(ms / 3600000), m: Math.floor(ms % 3600000 / 60000) };
  }

  // ---------- Saqlangan holat ----------

    const tot = WHEEL.reduce((a, p) => a + p.w, 0);
    const r = crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * tot;
    let acc = 0;
    for (let i = 0; i < WHEEL.length; i++) { acc += WHEEL[i].w; if (r < acc) return i; }
    return 0;
  }
  function givePrize(i) {

  // --- yordamchi chizish funksiyalari ---
  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawItem(ctx, it) {
    const x = it.x, y = it.y;
    ctx.save(); ctx.translate(x, y);
    if (it.type === "coin") {
      const sx = Math.max(0.2, Math.abs(Math.cos(it.spin * 5 + it.ph))), r = 15;
      ctx.scale(sx, 1);
      const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, r);
      g.addColorStop(0, "#fff3b0"); g.addColorStop(0.55, "#f5b82e"); g.addColorStop(1, "#b87a07");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "rgba(120,70,0,.55)"; ctx.beginPath(); ctx.arc(0, 0, r - 4, 0, 6.283); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.beginPath(); ctx.ellipse(-4, -6, 4, 2.2, -0.6, 0, 6.283); ctx.fill();
    } else if (it.type === "star") {
      ctx.rotate(Math.sin(it.spin * 3) * 0.35);
      ctx.shadowColor = "#ffd84a"; ctx.shadowBlur = 16;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const rad = i % 2 ? 8.5 : 20, a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
      ctx.closePath();
      const g = ctx.createLinearGradient(0, -20, 0, 18); g.addColorStop(0, "#fff7b0"); g.addColorStop(1, "#ffb300");
      ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0; ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(150,90,0,.7)"; ctx.stroke();
    } else if (it.type === "gem") {
      ctx.scale(1 + 0.06 * Math.sin(it.spin * 7), 1);
      ctx.shadowColor = "#4de3ff"; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(16, -5); ctx.lineTo(0, 19); ctx.lineTo(-16, -5); ctx.closePath();
      const g = ctx.createLinearGradient(-16, -19, 16, 19); g.addColorStop(0, "#d9fbff"); g.addColorStop(0.5, "#3fd8e8"); g.addColorStop(1, "#0e86a0");
      ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
      ctx.lineWidth = 1.2; ctx.strokeStyle = "rgba(255,255,255,.65)";
      ctx.beginPath(); ctx.moveTo(-16, -5); ctx.lineTo(16, -5); ctx.moveTo(-7, -5); ctx.lineTo(0, -19); ctx.lineTo(7, -5); ctx.moveTo(-7, -5); ctx.lineTo(0, 19); ctx.lineTo(7, -5); ctx.stroke();
    } else if (it.type === "bomb") {
      const p = 0.5 + 0.5 * Math.sin(it.spin * 8);
      ctx.shadowColor = `rgba(255,60,40,${0.35 + 0.45 * p})`; ctx.shadowBlur = 18;
      const g = ctx.createRadialGradient(-5, -6, 2, 0, 0, 17); g.addColorStop(0, "#6e6e7c"); g.addColorStop(0.55, "#23232b"); g.addColorStop(1, "#08080b");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 2, 16, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = "#3b3b46"; rr(ctx, -5, -17, 10, 6, 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#c9a46a"; ctx.beginPath(); ctx.moveTo(0, -17); ctx.quadraticCurveTo(3, -24, 9, -24); ctx.stroke();
      const sp = 3 + Math.random() * 3; ctx.fillStyle = Math.random() < .5 ? "#ffd84a" : "#ff8a2a";
      ctx.beginPath(); ctx.arc(9, -24, sp, 0, 6.283); ctx.fill();
      // jahldor ko'zlar
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(-5.5, 1, 3.3, 3.8, 0, 0, 6.283); ctx.ellipse(5.5, 1, 3.3, 3.8, 0, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#c01818"; ctx.beginPath(); ctx.arc(-5, 2, 1.7, 0, 6.283); ctx.arc(6, 2, 1.7, 0, 6.283); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.moveTo(-10, -4.5); ctx.lineTo(-2, -1.5); ctx.moveTo(10, -4.5); ctx.lineTo(2, -1.5); ctx.stroke();
    } else {
      const col = PU_COL[it.type], s = 1 + 0.08 * Math.sin(it.spin * 6);
      ctx.shadowColor = col; ctx.shadowBlur = 18;
      ctx.fillStyle = "rgba(15,12,6,.88)"; ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 17 * s, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
      ctx.font = "20px " + EMOJI_FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(PU_ICO[it.type], 0, 1);
    }
    ctx.restore();
  }
  function drawHero(ctx, g, by, tm) {
    const cx = g.px, tilt = Math.max(-0.3, Math.min(0.3, g.vx * 0.0008));
    const gl = ctx.createRadialGradient(cx, by, 4, cx, by, 80); gl.addColorStop(0, "rgba(245,184,46,.30)"); gl.addColorStop(1, "rgba(245,184,46,0)");
    ctx.fillStyle = gl; ctx.fillRect(cx - 82, by - 82, 164, 164);
    if (g.magnet > 0) {
      for (let k = 0; k < 2; k++) {
        const f = (tm * 1.1 + k * 0.5) % 1, r = f * 190;

      }

    }
    // qahramon (skin) — kutilganda siqiladi, harakatda egiladi

    ctx.restore();

    ctx.save(); ctx.translate(cx, by + 16); ctx.rotate(tilt * 0.6);
    ctx.beginPath(); ctx.moveTo(-40, -8); ctx.quadraticCurveTo(-34, 23, 0, 23); ctx.quadraticCurveTo(34, 23, 40, -8); ctx.closePath();
    const bg = ctx.createLinearGradient(0, -8, 0, 23); bg.addColorStop(0, "#ffd86a"); bg.addColorStop(0.6, "#d99a1c"); bg.addColorStop(1, "#8a5a08");
    ctx.fillStyle = bg; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(90,50,0,.6)"; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.beginPath(); ctx.ellipse(-16, 4, 8, 3.5, -0.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -8, 40, 7, 0, 0, 6.283); ctx.fillStyle = "#ffe08a"; ctx.fill(); ctx.stroke();
    ctx.restore();
    // qalqon
    if (g.shield) {
      const p = 0.5 + 0.5 * Math.sin(tm * 5);
      ctx.fillStyle = "rgba(106,184,255,.12)"; ctx.strokeStyle = `rgba(126,200,255,${0.5 + 0.35 * p})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(cx, by - 2, 50, 0, 6.283); ctx.fill(); ctx.stroke();
    }
    // reaksiya pufagi
    if (g.react) {
      const k = Math.min(1, g.react.life * 1.4), side = cx > g.w - 70 ? -1 : 1, bx = cx + side * 36, byy = by - 64 - (1 - k) * 12;
      ctx.globalAlpha = Math.min(1, g.react.life * 3);
      ctx.fillStyle = "rgba(255,255,255,.16)"; ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(bx, byy, 20, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.font = "24px " + EMOJI_FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(g.react.e, bx, byy + 1);
      ctx.globalAlpha = 1;
    }
  }

  // --- o'yin mantiqi ---
  function catchItem(g, type, x, el, v) {
    return { type, x, y: -26, v: v || g.h * (0.34 + el * 0.011 + Math.random() * 0.14), spin: Math.random() * 6, ph: Math.random() * 6.28 };
  }
  function catchSpawn(g, el) {
    const r = Math.random(), fr = g.frenzy > 0;
    let type = "coin";
    if (fr) { type = r < 0.08 ? "star" : r < 0.12 ? "gem" : "coin"; }
    else {
      const bomb = Math.min(0.27, 0.12 + el * 0.005), pu = el > 4 ? 0.05 : 0;
      if (r < bomb) type = "bomb";
      else if (r < bomb + pu) { type = ["magnet", "shield", "time"][Math.floor(Math.random() * 3)]; if (type === "shield" && g.shield) type = "coin"; }
      else if (r < bomb + pu + 0.06) type = "star";
      else if (r < bomb + pu + 0.085) type = "gem";
    }
    g.items.push(catchItem(g, type, 26 + Math.random() * (g.w - 52), el, fr ? g.h * 0.62 : 0));
  }
  // tangalardan hosil bo'lgan "naqsh"lar: ularni ketma-ket tutib kombo yig'iladi
  function catchWave(g, el) {
    const k = Math.floor(Math.random() * 3), v = g.h * (0.42 + el * 0.008), pad = 34, W = g.w - pad * 2;
    if (k === 0) { const x = pad + Math.random() * W; for (let i = 0; i < 6; i++) g.queue.push({ d: i * 0.14, x, v }); }
    else if (k === 1) { for (let i = 0; i < 9; i++) g.queue.push({ d: i * 0.17, x: g.w / 2 + Math.sin(i * 0.8) * W * 0.4, v }); }
    else { const dir = Math.random() < .5; for (let i = 0; i < 8; i++) g.queue.push({ d: i * 0.15, x: dir ? pad + W * i / 7 : pad + W * (1 - i / 7), v }); }
  }
  function catchBurst(g, x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = 60 + Math.random() * 170;
      g.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90, life: 0.45 + Math.random() * 0.45, max: 0.9, col, r: 1.5 + Math.random() * 2.5 });
    }
  }
  function catchPop(g, x, y, txt, col, size) { g.pops.push({ x, y, txt, col, size: size || 20, life: 0.85 }); }
  function catchBanner(g, txt, col) { g.banner = { txt, col, life: 1.2, max: 1.2 }; }

  function catchHit(g, it, by) {
    const x = it.x, y = by - 22;
    if (it.type === "bomb") {
      if (g.shield) { g.shield = 0; catchBurst(g, x, y, "#7ec8ff", 16); catchPop(g, x, y, "🛡️", "#7ec8ff", 24); g.react = { e: "😎", life: 0.9 }; haptic("medium"); }
      else {
        g.hearts--; g.combo = 0; g.shake = 0.4; g.flash = 0.5; g.squash = -0.8;
        catchBurst(g, x, y, "#ff7a3a", 26); catchBurst(g, x, y, "#555", 10); catchPop(g, x, y - 8, "-❤️", "#ff6b5b", 24);
        g.react = { e: g.hearts > 0 ? "😵" : "💀", life: 1 }; haptic("heavy");
        if (g.hearts <= 0) g.dead = 0.9;
      }
      return;
    }
    g.squash = 1;
    if (it.type === "magnet") { g.magnet = 7; catchBurst(g, x, y, PU_COL.magnet, 12); catchPop(g, x, y, "🧲 7s", PU_COL.magnet); g.react = { e: "🧲", life: 0.8 }; haptic("medium"); return; }
    if (it.type === "shield") { g.shield = 1; catchBurst(g, x, y, PU_COL.shield, 12); catchPop(g, x, y, "🛡️", PU_COL.shield, 24); g.react = { e: "😎", life: 0.9 }; haptic("medium"); return; }
    if (it.type === "time") { g.extra += 3; catchBurst(g, x, y, PU_COL.time, 12); catchPop(g, x, y, "+3s", PU_COL.time, 24); g.react = { e: "⏱️", life: 0.8 }; haptic("medium"); return; }
    // tanga / yulduz / olmos
    const base = it.type === "gem" ? 10 : it.type === "star" ? 5 : 1;
    g.combo++; g.best = Math.max(g.best, g.combo); g.caught++;
    const mult = catchMult(g.combo), pts = base * mult;
    g.score += pts;
    catchBurst(g, x, y, it.type === "gem" ? "#7ff0ff" : "#ffe27a", it.type === "coin" ? 6 : 14);
    catchPop(g, x, y, "+" + pts, mult >= 4 ? "#ffb04a" : "#ffdf7a", it.type === "coin" ? 20 : 26);
    if (it.type !== "coin") { g.react = { e: "🤩", life: 0.9 }; haptic("light"); }
    else if (g.caught % 12 === 0) g.react = { e: "😋", life: 0.8 };
    if (g.combo % 5 === 0 && g.combo <= 20) { catchBanner(g, t("c_combo", { n: catchMult(g.combo) }), "#ffdf7a"); g.react = { e: "🔥", life: 1 }; haptic("medium"); }
    if (g.combo > 0 && g.combo % 20 === 0) { g.frenzy = 6; catchBanner(g, t("c_rain"), "#ff9a3a"); g.react = { e: "🤑", life: 1.2 }; }
  }

  function catchUpdate(g, dt, el) {
    const by = g.h - 44, alive = g.state === "play" && g.dead < 0;
    const old = g.px; g.px += (g.x - g.px) * Math.min(1, 16 * dt); g.vx = (g.px - old) / Math.max(dt, 0.001);
    g.squash = g.squash > 0 ? Math.max(0, g.squash - dt * 5) : Math.min(0, g.squash + dt * 5);
    g.shake = Math.max(0, g.shake - dt); g.flash = Math.max(0, g.flash - dt * 1.6);
    g.magnet = Math.max(0, g.magnet - dt); g.frenzy = Math.max(0, g.frenzy - dt);
    if (g.react) { g.react.life -= dt; if (g.react.life <= 0) g.react = null; }
    if (g.banner) { g.banner.life -= dt; if (g.banner.life <= 0) g.banner = null; }
    if (g.goT > 0) g.goT -= dt;
    g.stars.forEach(s => { s.y -= s.v * 0.12 * dt; if (s.y < -4) { s.y = g.h + 4; s.x = Math.random() * g.w; } });
    if (g.frenzy > 0 && Math.random() < 0.6) g.parts.push({ x: Math.random() * g.w, y: g.h + 4, vx: (Math.random() - .5) * 30, vy: -120 - Math.random() * 140, life: 1.3, max: 1.3, col: "#ff9a3a", r: 2, ng: true });
    if (alive) {
      g.spawn -= dt;
      if (g.spawn <= 0) { catchSpawn(g, el); g.spawn = g.frenzy > 0 ? 0.1 : Math.max(0.3, 0.64 - el * 0.011); }
      g.wave -= dt;
      if (g.wave <= 0 && g.frenzy <= 0) { catchWave(g, el); g.wave = 6 + Math.random() * 3; }
      for (let i = g.queue.length - 1; i >= 0; i--) { const q = g.queue[i]; q.d -= dt; if (q.d <= 0) { g.items.push(catchItem(g, "coin", q.x, el, q.v)); g.queue.splice(i, 1); } }
    }
    for (let i = g.items.length - 1; i >= 0; i--) {
      const it = g.items[i];
      if (g.magnet > 0 && alive && it.type !== "bomb" && it.y > 10 && Math.abs(it.x - g.px) < 200) it.x += (g.px - it.x) * Math.min(1, 6 * dt);
      it.y += it.v * dt; it.spin += dt;
      if (alive && it.y > by - 26 && it.y < by + 24 && Math.abs(it.x - g.px) < 46) { g.items.splice(i, 1); catchHit(g, it, by); }
      else if (it.y > g.h - 4) {
        g.items.splice(i, 1);
        if (alive && (it.type === "coin" || it.type === "star" || it.type === "gem") && g.combo > 0) { g.combo = 0; catchPop(g, it.x, g.h - 26, "💨", "#b8a77a", 22); }
        catchBurst(g, it.x, g.h - 6, it.type === "bomb" ? "#777" : "#c9a44a", 4);
      }
    }
    for (let i = g.parts.length - 1; i >= 0; i--) { const p = g.parts[i]; p.life -= dt; if (p.life <= 0) { g.parts.splice(i, 1); continue; } if (!p.ng) p.vy += 480 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    for (let i = g.pops.length - 1; i >= 0; i--) { const p = g.pops[i]; p.life -= dt; p.y -= 50 * dt; if (p.life <= 0) g.pops.splice(i, 1); }
  }

  function catchDraw(g, now) {
    const ctx = g.ctx, w = g.w, h = g.h, by = h - 44, tm = now / 1000, mult = catchMult(g.combo);
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    if (g.shake > 0) { const k = Math.min(1, g.shake * 3) * 10; ctx.translate((Math.random() - .5) * k, (Math.random() - .5) * k); }
    // fon
    const bg = ctx.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, "#261b0b"); bg.addColorStop(1, "#0f0c06");
    ctx.fillStyle = bg; ctx.fillRect(-14, -14, w + 28, h + 28);
    if (g.frenzy > 0 || mult > 1) {
      const a = g.frenzy > 0 ? 0.18 + 0.08 * Math.sin(tm * 10) : (mult - 1) * 0.035;
      const fg = ctx.createRadialGradient(w / 2, h, 10, w / 2, h, h * 1.1); fg.addColorStop(0, `rgba(255,120,30,${a * 2})`); fg.addColorStop(1, "rgba(255,120,30,0)");
      ctx.fillStyle = fg; ctx.fillRect(-14, -14, w + 28, h + 28);
    }
    ctx.fillStyle = "#fff3c4";
    g.stars.forEach(s => { ctx.globalAlpha = 0.2 + 0.4 * Math.abs(Math.sin(tm * 1.3 + s.ph)); ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); });
    ctx.globalAlpha = 1;
    const gr = ctx.createLinearGradient(0, h - 32, 0, h); gr.addColorStop(0, "rgba(245,184,46,0)"); gr.addColorStop(1, "rgba(245,184,46,.3)");
    ctx.fillStyle = gr; ctx.fillRect(0, h - 32, w, 32);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    g.items.forEach(it => drawItem(ctx, it));
    drawHero(ctx, g, by, tm);
    g.parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); });
    ctx.globalAlpha = 1;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    g.pops.forEach(p => {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.4)); ctx.font = `800 ${p.size}px sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(p.txt, p.x, p.y); ctx.fillStyle = p.col; ctx.fillText(p.txt, p.x, p.y);
    });
    ctx.globalAlpha = 1;
    ctx.restore();

    // --- ustki qatlam (silkinmaydi) ---
    ctx.textBaseline = "middle";
    if (g.combo >= 2) {
      const txt = `🔥 ${g.combo}  ×${mult}`;
      ctx.font = "800 15px sans-serif"; ctx.textAlign = "left";
      const tw = ctx.measureText(txt).width + 24;
      ctx.fillStyle = "rgba(0,0,0,.45)"; rr(ctx, 10, 10, tw, 30, 15); ctx.fill();
      ctx.fillStyle = mult >= 4 ? "#ffb04a" : "#ffdf7a"; ctx.fillText(txt, 22, 26);
      const prog = mult >= 5 ? 1 : (g.combo % 5) / 5;
      ctx.fillStyle = "rgba(255,255,255,.15)"; rr(ctx, 10, 44, tw, 5, 2.5); ctx.fill();
      if (prog > 0) { ctx.fillStyle = "#ffb02e"; rr(ctx, 10, 44, Math.max(5, tw * prog), 5, 2.5); ctx.fill(); }
    }
    let sx = w - 12; ctx.textAlign = "right"; ctx.font = "800 14px sans-serif";
    if (g.magnet > 0) { ctx.fillStyle = PU_COL.magnet; ctx.fillText("🧲 " + Math.ceil(g.magnet) + "s", sx, 26); sx -= 62; }
    if (g.shield) { ctx.fillStyle = PU_COL.shield; ctx.fillText("🛡️", sx, 26); }
    ctx.textAlign = "center";
    if (g.banner) {
      const k = g.banner.life / g.banner.max, s = 0.8 + 0.4 * Math.min(1, (1 - k) * 6);
      ctx.globalAlpha = k < 0.3 ? k / 0.3 : 1; ctx.font = `900 ${Math.round(32 * s)}px sans-serif`;
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.strokeText(g.banner.txt, w / 2, h * 0.3); ctx.fillStyle = g.banner.col; ctx.fillText(g.banner.txt, w / 2, h * 0.3);
      ctx.globalAlpha = 1;
    }
    if (g.state === "count") {
      const f = g.cd - Math.floor(g.cd), n = Math.ceil(g.cd);
      ctx.globalAlpha = 0.3 + 0.7 * f; ctx.font = `900 ${Math.round(96 * (0.7 + 0.3 * f))}px sans-serif`;
      ctx.lineWidth = 8; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(String(n), w / 2, h * 0.4); ctx.fillStyle = "#ffdf7a"; ctx.fillText(String(n), w / 2, h * 0.4);
      ctx.globalAlpha = 1;
    } else if (g.goT > 0) {
      const k = Math.min(1, g.goT / 0.7); ctx.globalAlpha = k; ctx.font = `900 ${Math.round(56 + (1 - k) * 22)}px sans-serif`;
      ctx.lineWidth = 7; ctx.strokeStyle = "rgba(0,0,0,.55)"; ctx.strokeText(t("c_go"), w / 2, h * 0.4); ctx.fillStyle = "#8cff7a"; ctx.fillText(t("c_go"), w / 2, h * 0.4);
      ctx.globalAlpha = 1;
    }
    if (g.flash > 0) { ctx.fillStyle = `rgba(255,50,40,${g.flash * 0.55})`; ctx.fillRect(0, 0, w, h); }
  }

  function startCatch() {
    if (CG || catchLeft() <= 0) return;
    S.catchLeft--; save();
    const cv = $("catchCv"), w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const now = performance.now();
    const stars = Array.from({ length: 28 }, () => ({ x: Math.random() * w, y: Math.random() * h, r: 0.6 + Math.random() * 1.4, ph: Math.random() * 6.28, v: 6 + Math.random() * 14 }));
    CG = { w, h, ctx, x: w / 2, px: w / 2, vx: 0, ico: skinOf(S.skin).ico, stars,
      items: [], parts: [], pops: [], queue: [],
      score: 0, combo: 0, best: 0, caught: 0, hearts: CATCH_HEARTS, shield: 0, magnet: 0, extra: 0, frenzy: 0,
      state: "count", cd: 3, t0: 0, last: now, spawn: 0.3, wave: 5, shake: 0, flash: 0, squash: 0, dead: -1, goT: 0,
      react: null, banner: null, raf: 0, uiHearts: -1 };
    $("catchWrap").classList.add("playing");
    $("catchOv").classList.remove("done");
    $("catchRes").textContent = ""; $("catchStats").textContent = ""; $("catchInfo").textContent = "";
    $("catchScore").textContent = t("c_score", { n: 0 }); $("catchTime").textContent = t("c_time", { n: CATCH_TIME });
    $("catchHearts").textContent = heartsStr(CATCH_HEARTS);
    haptic("medium"); renderCatch();
    CG.raf = requestAnimationFrame(catchFrame);
  }

  function catchFrame(now) {
    const g = CG; if (!g) return;
    const dt = Math.min(0.05, (now - g.last) / 1000); g.last = now;
    if (g.state === "count") {
      g.cd -= dt;
      if (g.cd <= 0) { g.state = "play"; g.t0 = now; g.goT = 0.7; haptic("medium"); }
    }
    const playing = g.state === "play";
    const el = playing ? (now - g.t0) / 1000 : 0;
    const left = CATCH_TIME + g.extra - el;
    if (playing && left <= 0) { endCatch(); return; }
    catchUpdate(g, dt, el);
    if (g.dead >= 0) { g.dead -= dt; if (g.dead < 0) { endCatch(); return; } }
    catchDraw(g, now);
    $("catchScore").textContent = t("c_score", { n: g.score });
    $("catchTime").textContent = t("c_time", { n: Math.max(0, Math.ceil(playing ? left : CATCH_TIME)) });
    if (g.uiHearts !== g.hearts) { g.uiHearts = g.hearts; $("catchHearts").textContent = heartsStr(g.hearts); }
    g.raf = requestAnimationFrame(catchFrame);
  }

  function endCatch() {
    const g = CG; if (!g) return;
    CG = null; cancelAnimationFrame(g.raf);
    $("catchWrap").classList.remove("playing");
    const played = g.state === "play";
    if (!played) S.catchLeft++;                      // boshlanmay chiqib ketsa, urinish qaytariladi
    const reward = played ? Math.min(g.score, CATCH_CAP) * catchRate() : 0;
    if (reward > 0) addCoins(reward);
    const newBest = played && g.score > (S.catchBest || 0);
    if (newBest) S.catchBest = g.score;
    save(); render(); haptic("heavy");
    $("catchScore").textContent = t("c_score", { n: g.score }); $("catchTime").textContent = "";
    $("catchHearts").textContent = heartsStr(g.hearts);
    if (played) {
      const stars = g.score >= 80 ? "⭐⭐⭐" : g.score >= 40 ? "⭐⭐" : "⭐";
      $("catchRes").textContent = stars + "\n" + t("c_result", { s: g.score, n: fmt(reward) });
      $("catchStats").textContent = t("c_stats", { c: g.best, k: g.caught }) + (newBest ? "\n" + t("c_best") : "");
      $("catchOv").classList.add("done");
      if (reward > 0) toast("🪙 +" + fmt(reward));
    }
    renderCatch();
  }

  const catchCv = $("catchCv");
  function catchMove(e) { if (!CG) return; const r = catchCv.getBoundingClientRect(); CG.x = Math.max(30, Math.min(CG.w - 30, e.clientX - r.left)); }
  catchCv.addEventListener("pointerdown", e => { e.preventDefault(); try { catchCv.setPointerCapture(e.pointerId); } catch (_) {} catchMove(e); });
  catchCv.addEventListener("pointermove", e => { e.preventDefault(); catchMove(e); });
  $("catchBtn").onclick = startCatch;
  $("openCatch").onclick = () => { $("catchOv").classList.remove("done"); $("catchStats").textContent = ""; $("catchHearts").textContent = ""; $("catchRes").textContent = ""; $("catchScore").textContent = ""; $("catchTime").textContent = ""; renderCatch(); $("gamesList").style.display = "none"; $("catchView").style.display = "block"; };
  $("catchBack").onclick = () => { if (CG) endCatch(); $("catchView").style.display = "none"; $("gamesList").style.display = "block"; renderCatch(); };

  // ---------- Do'stlar ----------
  const ref = `https://t.me/${BOT_USERNAME}?start=${uid}`;
  $("refLink").textContent = ref;
  $("shareBtn").onclick = () => {
    const url = "https://t.me/share/url?url=" + encodeURIComponent(ref) + "&text=" + encodeURIComponent(t("share_text"));
    if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
  };
  $("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(ref); toast(t("copied")); } catch (e) { toast(t("copy_fail")); } };

  // ---------- Reyting (Firebase) ----------
  async function pushScore() {
    if (!FIREBASE_URL || uid === "guest") return;
    const total = Math.floor(S.total);
    if (total === S.synced) return;
    try {
      await fetch(`${FIREBASE_URL}/players/${uid}.json`, { method: "PUT",
        body: JSON.stringify({ n: myName.slice(0, 24), c: total, s: S.skin, u: Date.now() }) });
      S.synced = total; save();
    } catch (e) {}
  }
  async function loadBoard() {
    const box = $("board");
    if (!FIREBASE_URL) { box.innerHTML = `<div class="box muted">${t("r_off")}</div>`; return; }
    box.innerHTML = `<div class="muted">${t("r_loading")}</div>`;
    try {
      await pushScore();
      const res = await fetch(`${FIREBASE_URL}/players.json?orderBy=${encodeURIComponent('"c"')}&limitToLast=50`);
      const data = await res.json() || {};
      const arr = Object.entries(data).map(([id, v]) => ({ id, n: v.n || t("player"), c: v.c || 0, s: v.s })).sort((a, b) => b.c - a.c);
      box.innerHTML = "";
      if (!arr.length) { box.innerHTML = `<div class="muted">${t("r_none")}</div>`; return; }
      const medals = ["🥇", "🥈", "🥉"];
      arr.forEach((p, i) => {
        const d = document.createElement("div"); d.className = "card" + (p.id === uid ? " me" : "");
        const pos = document.createElement("div"); pos.className = "pos"; pos.textContent = medals[i] || (i + 1);
        const ico = document.createElement("div"); ico.className = "ico"; ico.textContent = skinOf(p.s).ico;
        const info = document.createElement("div"); info.className = "info";
        const nm = document.createElement("div"); nm.className = "name"; nm.textContent = p.n + (p.id === uid ? " " + t("r_you") : "");
        const rk = document.createElement("div"); rk.className = "desc";
        let ri = 0; RANKS.forEach((x, k) => { if (p.c >= x.at) ri = k; }); rk.textContent = RANKS[ri].ico + " " + rankName(ri);
        info.append(nm, rk);
        const sc = document.createElement("div"); sc.className = "score"; sc.textContent = fmt(p.c) + " 🪙";
        d.append(pos, ico, info, sc); box.appendChild(d);
      });
    } catch (e) { box.innerHTML = `<div class="box muted">${t("r_err")}</div>`; }
  }

  // ---------- Yo'riqnoma ----------
  const TU = [{ ico: "🦆", k: "tu1" }, { ico: "⬆️", k: "tu2" }, { ico: "🎮", k: "tu3" }];
  let tuIdx = 0;
  function renderTut() {
    const s = TU[tuIdx];
    $("tuIco").textContent = s.ico; $("tuTitle").textContent = t(s.k + "_t"); $("tuDesc").textContent = t(s.k + "_d");
    $("tuDots").innerHTML = TU.map((_, i) => `<span class="${i === tuIdx ? "on" : ""}"></span>`).join("");
    const last = tuIdx === TU.length - 1;

    $("tuSkip").textContent = t("tu_skip"); $("tuSkip").style.visibility = last ? "hidden" : "visible";
  }
  function showTut() { tuIdx = 0; renderTut(); $("tutorial").style.display = "flex"; }
  function closeTut() { $("tutorial").style.display = "none"; S.seen = true; save(); }
  $("tuNext").onclick = () => { if (tuIdx < TU.length - 1) { tuIdx++; renderTut(); } else closeTut(); };
  $("tuSkip").onclick = closeTut;

  // ---------- Til va sozlamalar ----------
  function renderSettings() {
    $("vibBtn").textContent = S.vib === false ? t("off") : t("on");
    document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    render(); renderUpgrades(); renderSkins(); renderDaily(); renderQuest(); renderChan(); renderGames(); renderSettings(); renderTut();
    if (wheelBuilt) buildWheel();
    if ($("p-rank").classList.contains("active")) loadBoard();
    if (!CG) { $("catchRes").textContent = ""; }
    $("user").textContent = tgUser ? ("👑 " + (tgUser.first_name || t("player"))) : "Don Coin";
  }
  function setLang(l) { if (!LANGS.includes(l) || l === lang) return; lang = l; S.lang = l; save(); applyLang(); }
  document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => setLang(b.dataset.lang));
  $("vibBtn").onclick = () => { S.vib = S.vib === false; save(); renderSettings(); if (S.vib) haptic("medium"); };
  $("tutBtn").onclick = () => showTut();
  $("resetBtn").onclick = () => ask(t("reset_ask"), () => {
    const keep = { lang: S.lang, vib: S.vib };
    S = JSON.parse(JSON.stringify(def));
    S.last = Date.now(); S.seen = true; S.lang = keep.lang; S.vib = keep.vib;
    turboRefresh(); save(); applySkin(); applyLang(); go("p-tap"); toast(t("reset_done"));
  });

  // ---------- Navigatsiya ----------
  function go(p) {
    if (CG) endCatch();
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x.dataset.p === p));
    document.querySelectorAll(".page").forEach(x => x.classList.toggle("active", x.id === p));
    if (p === "p-up") renderUpgrades();
    if (p === "p-skin") renderSkins();
    if (p === "p-task") { renderDaily(); renderQuest(); }
    if (p === "p-rank") loadBoard();
    if (p === "p-games") renderGames();
    if (p === "p-set") renderSettings();
  }
  document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.p));
  $("setBtn").onclick = () => go("p-set");
  $("setBack").onclick = () => go("p-tap");

  // ---------- Asosiy sikl ----------
  setInterval(() => {
    S.energy = Math.min(maxEn(), S.energy + regen());
    if (perHour()) addCoins(perHour() / 3600);
    S.last = Date.now();
    render(); save();
    if ($("p-up").classList.contains("active")) renderUpgrades();
    if ($("p-skin").classList.contains("active")) renderSkins();
    if ($("p-task").classList.contains("active")) { renderDaily(); renderQuest(); }
    if ($("p-games").classList.contains("active")) renderGames();
  }, 1000);
  setInterval(pushScore, 20000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && CG) endCatch();   // fon rejimida o'yin to'xtaydi
    S.last = Date.now(); save(); if (document.hidden) pushScore();
  });
  window.addEventListener("pagehide", save);

  applySkin(); applyLang(); pushScore();
  if (!S.seen) showTut();
})();
</script>
</body>
</html>
